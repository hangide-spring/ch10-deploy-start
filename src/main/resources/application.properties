# 서버 포트와 한글 인코딩 — force 가 없으면 응답에서 한글이 깨질 수 있다
server.port=8080
spring.servlet.encoding.charset=utf-8
spring.servlet.encoding.force=true

# H2 인메모리 데이터베이스 연결 — 서버가 켜질 때 만들어지고 꺼지면 사라진다
spring.datasource.url=jdbc:h2:mem:blog
spring.datasource.username=sa

# 브라우저에서 /h2-console 로 데이터베이스를 들여다볼 수 있게 한다
spring.h2.console.enabled=true

# Entity를 보고 테이블을 새로 만든다 (schema.sql 대신 Entity가 테이블의 기준)
spring.jpa.hibernate.ddl-auto=create
# Hibernate가 테이블을 만든 "뒤에" data.sql이 실행되게 한다
spring.jpa.defer-datasource-initialization=true

# 실행되는 SQL을 콘솔에서 보기 좋게 출력한다
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
